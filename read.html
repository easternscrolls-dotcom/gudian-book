<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
    <a href="./index.html" class="back-btn">← 返回书库</a>
    <h2 class="article-title" id="book-title">加载中</h2>
    <div class="article-wrap">
        <div id="article-content" class="load-text">正在加载正文...</div>
    </div>
</div>

<!-- 引入brotli解压CDN -->
<script src="https://cdn.jsdelivr.net/npm/brotli-wasm@2.0.0/brotli.min.js"></script>
<script src="./js/reader.js"></script>
<script>
    (async ()=>{
        const searchParams = new URLSearchParams(location.search);
        const bookPath = searchParams.get("book");
        const bookName = searchParams.get("title") || "古籍";
        document.getElementById("book-title").innerText = bookName;

        if(!bookPath){
            document.getElementById("article-content").innerText = "链接参数错误";
            return;
        }
        const text = await loadChapter(bookPath);
        if(text){
            document.getElementById("article-content").innerText = text;
        }else{
            document.getElementById("article-content").innerText = "章节加载失败，文件不存在或网络异常";
        }
    })();
</script>
</body>
</html>
