name = "gudian-book-crawler-router"
main = "crawler-router.js"
compatibility_date = "2024-09-23"

# 回源到 Pages 前端的地址（普通用户请求转发到这里）
# 改成你实际的 *.pages.dev 或自定义域名
[vars]
PAGES_ORIGIN = "https://gudian-book.pages.dev"

# R2 存储桶：存放爬虫静态快照 snapshot/<分类>/<书名>.html
# 部署前需先创建桶：wrangler r2 bucket create gudian-book-snapshots
[[r2_buckets]]
binding = "BOOK_SNAPSHOT"
bucket_name = "gudian-book-snapshots"
